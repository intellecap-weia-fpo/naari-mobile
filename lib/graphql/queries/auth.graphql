mutation SignIn($username: String!, $password: String!) {
  signIn(username: $username, password: $password) {
    token
    refreshToken
    payload
    refreshExpiresIn
  }
}

mutation RefreshToken($refreshToken: String!) {
  refreshToken(refreshToken: $refreshToken) {
    token
    refreshToken
    payload
    refreshExpiresIn
  }
}

mutation Logout {
  logout {
    deleted
  }
}

query Me {
  me {
    id
    username
    email
    firstName
    lastName
    isActive
    isStaff
  }
}