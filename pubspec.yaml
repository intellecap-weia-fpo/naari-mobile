name: naari_survey
description: "Naari Survey - A Flutter project for surveys."

publish_to: 'none'

version: 1.0.12+119

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # GraphQL client for type-safe API communication
  graphql_flutter: ^5.1.2
  graphql_codegen: ^1.2.4
  json_annotation: ^4.9.0

  # Google Fonts for Space Grotesk
  google_fonts: ^6.3.3
  shared_preferences: ^2.5.3
  package_info_plus: ^8.0.2

  # HTTP client for debugging
  http: ^1.5.0
  go_router: ^16.1.0

  # Cookie management
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.3.0
  dio: ^5.9.0

  # Internationalization
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  flutter_tts: ^4.2.3
  path_provider: ^2.1.4
  image_picker: ^1.2.0
  geolocator: ^13.0.1
  signature: ^6.3.0
  expressions: ^0.2.5+2

  # Offline support dependencies
  connectivity_plus: ^6.1.3      # Network connectivity monitoring
  sqflite: ^2.4.2                # Local SQLite database
  path: ^1.9.1                   # Path manipulation for database
  uuid: ^4.5.1                   # Generate unique IDs for offline items

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.5.4
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/place.json
    - assets/privacy_policy.json
    - assets/icon-512.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon-512.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/icon-512.png
  remove_alpha_ios: true
